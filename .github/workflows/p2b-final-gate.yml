name: P2B Final Gate

on:
  push:
    branches:
      - "ci/p2b-final-gate-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTGRES_DB: gearia
  POSTGRES_USER: gearia
  POSTGRES_PASSWORD: ci-postgres-password
  LIFECYCLE_TOKEN_PEPPER: ci-lifecycle-token-pepper-not-a-production-secret
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://gearia:ci-postgres-password@localhost:5432/gearia
  REDIS_URL: redis://localhost:6379/0
  OPENAI_API_KEY: ""
  VOYAGE_API_KEY: ""
  AUTH_ENABLED: "false"

jobs:
  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gearia
          POSTGRES_USER: gearia
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearia -d gearia"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Compile API
        run: python -m compileall -q app
      - name: Upgrade migrations and verify head
        run: |
          alembic upgrade head
          test "$(alembic heads)" = "20260730_0010 (head)"
          test "$(alembic current)" = "20260730_0010 (head)"
      - name: Verify API import path
        run: python -c "import app; print(app.__file__)"
      - name: Run complete API suite
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/api-pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -Eq '[1-9][0-9]* failed' /tmp/api-pytest.log
          grep -Eq '(56[89]|5[7-9][0-9]|[6-9][0-9]{2,}) passed' /tmp/api-pytest.log
      - name: Upload API pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-log
          path: /tmp/api-pytest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build API image
        run: docker build --target runtime -t gearia-api-p2b-ci .

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Typecheck web
        run: npm run typecheck
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Confirm lockfile unchanged
        run: git diff --exit-code -- package-lock.json

  docker-builds:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Write ephemeral Compose environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=gearia
          POSTGRES_USER=gearia
          POSTGRES_PASSWORD=ci-postgres-password
          LIFECYCLE_TOKEN_PEPPER=ci-lifecycle-token-pepper-not-a-production-secret
          ENVIRONMENT=test
          EOF
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web without cache
        run: |
          docker compose --progress=plain build --no-cache api
          docker compose --progress=plain build --no-cache web
      - name: Build API and web with normal cache behavior
        run: |
          docker compose build api
          docker compose build web
      - name: Confirm no certificate or lockfile was introduced
        run: |
          test -z "$(git ls-files '*.pem' '*.cer' '*.crt')"
          git diff --exit-code -- apps/web/Dockerfile apps/web/package.json apps/web/package-lock.json

  runtime-smoke:
    name: Runtime smoke
    runs-on: ubuntu-latest
    needs: docker-builds
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Write ephemeral Compose environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=gearia
          POSTGRES_USER=gearia
          POSTGRES_PASSWORD=ci-postgres-password
          LIFECYCLE_TOKEN_PEPPER=ci-lifecycle-token-pepper-not-a-production-secret
          ENVIRONMENT=test
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          EOF
      - name: Start production images
        run: docker compose up -d --build postgres redis api web
      - name: Wait for API and web health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8000/health/ready >/dev/null \
              && curl --fail --silent --show-error http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=200 api web
          exit 1
      - name: Verify public smoke endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/live
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error http://localhost:3000/ | grep -q 'GearIA Operating System'
          curl --fail --silent --show-error http://localhost:3000/status | grep -q 'STATUS OPERACIONAL'
      - name: Confirm containers stayed healthy and logs are sanitized
        run: |
          test -z "$(docker compose ps --status restarting -q)"
          ! docker compose logs --no-color --tail=200 api web | grep -F "$LIFECYCLE_TOKEN_PEPPER"
          ! docker compose logs --no-color --tail=200 api web | grep -Ei 'UNABLE_TO_VERIFY_LEAF_SIGNATURE|Exit handler never called'
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down -v

  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve accumulated P2A/P2B base
        run: |
          git rev-parse --verify origin/main
          BASE_SHA="$(git merge-base origin/main HEAD)"
          test -n "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf 'P2B_BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Validate accumulated whitespace and locked web inputs
        run: |
          git diff --check "$P2B_BASE_SHA" HEAD
          git diff --exit-code "$P2B_BASE_SHA" HEAD -- \
            apps/web/Dockerfile \
            apps/web/package.json \
            apps/web/package-lock.json
          test "$(node -p "require('./apps/web/package-lock.json').lockfileVersion")" = "3"
      - name: Scan tracked files for secret patterns
        run: |
          matches="$(git grep -IlE 'BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}' -- . || true)"
          test -z "$matches"
      - name: Confirm certificates and migration chain policy
        run: |
          test -z "$(git ls-files '*.pem' '*.cer' '*.crt')"
          test "$(find services/api/migrations/versions -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 10
          test -f services/api/migrations/versions/20260730_0010_add_user_lifecycle_tokens.py
          migration_changes="$(git diff --name-status "$P2B_BASE_SHA" HEAD -- services/api/migrations/versions)"
          expected_changes=$'A\tservices/api/migrations/versions/20260729_0009_create_workspace_tenancy.py\nA\tservices/api/migrations/versions/20260730_0010_add_user_lifecycle_tokens.py'
          test "$migration_changes" = "$expected_changes"
