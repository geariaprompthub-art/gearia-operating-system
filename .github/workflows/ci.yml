name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gearia
          POSTGRES_USER: gearia
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gearia -d gearia"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gearia:ci-password@localhost:5432/gearia
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ""
      VOYAGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q
      - name: Basic secret scan
        run: |
          ! git grep -nEi 'sk-[a-z0-9]{20,}|voyage-[a-z0-9]{20,}' -- ':!*.lock'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
